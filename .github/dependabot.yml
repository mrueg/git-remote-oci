version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      # Conventional Commits: .goreleaser.yaml drops these from the changelog
      # by this prefix, so it has to be exactly this.
      prefix: "chore(deps)"
    groups:
      # One pull request for the routine bumps rather than one per module; a
      # major bump still arrives on its own, because that is the one worth
      # reading the release notes for.
      go-minor-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
