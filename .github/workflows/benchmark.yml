name: E2E Performance Benchmark

on:
  workflow_dispatch:
    inputs:
      commits:
        description: 'Number of commits to generate for benchmark'
        required: false
        default: '20000'
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: E2E Performance Benchmark Suite
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Pre-pull registry image
        run: docker pull registry:3

      # This does not run on pull requests: it is an hour of runner time whose
      # output is a table nobody compares against a baseline, and ci.yml already
      # proves the suite builds. It runs on every push to main and on demand,
      # which is where a regression is looked for.
      - name: Run E2E Benchmark Suite
        env:
          BENCHMARK_COMMITS: ${{ github.event.inputs.commits || '20000' }}
        run: make bench 2>&1 | tee bench.log

      # The suite reports with t.Logf, which lands in the raw log and nowhere
      # anyone looks. Put the timings on the run's summary page instead.
      #
      # There is deliberately no pass/fail threshold: a wall-clock budget on a
      # shared runner is flaky, and a relative one needs a stored baseline this
      # does not have. The numbers are published so a regression is visible, not
      # so it is enforced.
      - name: Report timings
        if: always()
        run: |
          {
            echo '## Benchmark'
            echo
            echo "commits: ${BENCHMARK_COMMITS:-20000}"
            echo
            echo '```'
            grep -E '^\s+(e2e_)?benchmark.*\.go:[0-9]+:' bench.log |
              sed 's/^[[:space:]]*//' | head -100
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          BENCHMARK_COMMITS: ${{ github.event.inputs.commits || '20000' }}
