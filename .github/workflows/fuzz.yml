name: Fuzz Campaign

# The smoke run in ci.yml gives each target 15 seconds, which proves the target
# still builds and its seed corpus still passes. It does not find anything. This
# is the campaign that does: every target, for minutes rather than seconds,
# nightly and out of the way of pull requests.
#
# A crash is reproducible from the artifact this uploads: drop the file into the
# target's testdata/fuzz/<FuzzName>/ directory and `go test` replays it as an
# ordinary unit test, with no fuzzing needed.

on:
  schedule:
    # 03:17 UTC. Off the hour, because everything else runs on the hour.
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      fuzztime:
        description: 'Time per fuzz target (Go duration, e.g. 10m)'
        required: false
        default: '10m'

permissions:
  contents: read

# One campaign at a time. A scheduled run overlapping the previous one just
# competes for the same runners.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  # The target list is discovered rather than written down, so a new fuzz target
  # — or one in a package that does not exist yet — is picked up without anyone
  # remembering to edit this file.
  discover:
    name: Discover fuzz targets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      targets: ${{ steps.list.outputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - id: list
        run: |
          set -euo pipefail
          targets='[]'
          for pkg in $(go list ./...); do
            for target in $(go test -list '^Fuzz' "$pkg" 2>/dev/null | grep '^Fuzz' || true); do
              targets=$(printf '%s' "$targets" | jq -c \
                --arg p "$pkg" --arg t "$target" '. + [{package:$p, target:$t}]')
            done
          done
          echo "Discovered: $targets"
          if [ "$(printf '%s' "$targets" | jq 'length')" -eq 0 ]; then
            echo "::error::no fuzz targets found; the campaign would be a no-op"
            exit 1
          fi
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  campaign:
    name: ${{ matrix.target }}
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      # One crashing target must not cancel the others: each is an independent
      # search, and a nightly run should report every crash it found, not the
      # first.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.targets) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Fuzz ${{ matrix.target }}
        env:
          FUZZTIME: ${{ github.event.inputs.fuzztime || '10m' }}
        run: |
          go test ${{ matrix.package }} \
            -run '^$' -fuzz '^${{ matrix.target }}$' -fuzztime="$FUZZTIME"

      # go test writes the failing input to testdata/fuzz/<FuzzName>/ on a
      # crash. Without this the input is discarded with the runner, and the
      # crash is only reproducible by getting lucky twice.
      - name: Upload crasher
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crasher-${{ matrix.target }}
          path: '**/testdata/fuzz/**'
          if-no-files-found: warn
          retention-days: 30
